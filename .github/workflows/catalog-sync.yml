name: Catalog Synchronization

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Synchronize OpenRouter catalog
        run: |
          python3 main.py --sync-openrouter

      - name: Run test suite and validation
        run: |
          python3 -m unittest discover tests
          python3 main.py --validate

      - name: Commit and push if catalog changed
        run: |
          if ! git diff --quiet data/models.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/models.json data/backups/
            git commit -m "chore(catalog): synchronisation automatique hebdomadaire du catalogue de modèles"
            git push
          else
            echo "Aucune modification constatée sur data/models.json."
          fi
