name: Jules PR Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  issue_comment:
    types: [created]

jobs:
  jules-check:
    if: |
      contains(github.event.pull_request.labels.*.name, 'jules') ||
      contains(github.event.comment.body, '/jules') ||
      startsWith(github.head_ref, 'jules/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dev Dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run Unit Test Suite
        run: python3 -m unittest discover tests

      - name: Validate Model Pool Allocation
        run: python3 main.py --validate

      - name: Lint & Static Code Analysis
        run: |
          python3 -m ruff check .
          python3 -m mypy .
